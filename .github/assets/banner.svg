<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <pattern id="pcb" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 20h30l10 10v50M80 60H50l-10-10V0M60 80V70l10-10h10" fill="none" stroke="#22c55e" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="30" cy="20" r="3" fill="#22c55e" fill-opacity=".35"/><circle cx="50" cy="60" r="3" fill="#22c55e" fill-opacity=".35"/>
    </pattern>
    <style>.box{animation:bx 2.4s ease-in-out infinite}.b2{animation-delay:-.8s}.b3{animation-delay:-1.6s}@keyframes bx{0%,100%{opacity:1}50%{opacity:.35}}</style>
  </defs>
  <rect width="1200" height="320" fill="#052e16"/>
  <rect width="1200" height="320" fill="url(#pcb)"/>
  <!-- detected objects -->
  <g transform="translate(700 40)">
    <!-- phone -->
    <rect x="20" y="40" width="70" height="130" rx="10" fill="#1f2937" stroke="#6b7280" stroke-width="2"/><rect x="28" y="52" width="54" height="96" fill="#111827"/><path d="M28 52l54 60M50 52l32 40" stroke="#374151"/>
    <!-- battery -->
    <rect x="140" y="110" width="110" height="56" rx="6" fill="#ca8a04"/><rect x="250" y="126" width="10" height="24" fill="#a16207"/><text x="195" y="146" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#422006">+ −</text>
    <!-- chip -->
    <g transform="translate(330 50)"><rect width="100" height="100" rx="6" fill="#111827"/><g stroke="#9ca3af" stroke-width="4"><path d="M15 0v-12M35 0v-12M55 0v-12M75 0v-12M15 100v12M35 100v12M55 100v12M75 100v12M0 20h-12M0 50h-12M0 80h-12M100 20h12M100 50h12M100 80h12"/></g><text x="50" y="58" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#4ade80">IC</text></g>
    <g font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="none" stroke-width="3">
      <g class="box"><rect x="10" y="30" width="90" height="150" stroke="#f43f5e"/><rect x="10" y="12" width="102" height="20" fill="#f43f5e" stroke="none"/><text x="14" y="27" fill="#fff" stroke="none">phone 0.94</text></g>
      <g class="box b2"><rect x="132" y="100" width="136" height="76" stroke="#facc15"/><rect x="132" y="82" width="116" height="20" fill="#facc15" stroke="none"/><text x="136" y="97" fill="#111" stroke="none">battery 0.89</text></g>
      <g class="box b3"><rect x="310" y="30" width="140" height="140" stroke="#38bdf8"/><rect x="310" y="12" width="92" height="20" fill="#38bdf8" stroke="none"/><text x="314" y="27" fill="#111" stroke="none">pcb 0.91</text></g>
    </g>
    <text x="10" y="244" font-family="Consolas, Menlo, monospace" font-size="14" fill="#86efac">conf ≥ 0.25 · IoU 0.45 · image | video | camera | ADB | ws</text>
  </g>
  <text x="62" y="110" font-family="Consolas, Menlo, monospace" font-size="18" fill="#4ade80" letter-spacing="3">♻ YOLO + GRADIO</text>
  <text x="58" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="900" fill="#f0fdf4">E-Waste</text>
  <text x="60" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="300" fill="#bbf7d0">Detection System</text>
</svg>
